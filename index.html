<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Team Request Form | NCL</title>
<style>
  :root {
    --navy: #003366;
    --gold: #c8a04b;
    --bg: #f5f7fa;
    --border: #d7dce3;
    --text: #1b2430;
    --muted: #5b6572;
    --error: #b3261e;
    --success: #1e7a34;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 28px 24px;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
  }
  header p {
    margin: 6px 0 0;
    color: #cdd8e6;
    font-size: 14px;
  }
  main {
    max-width: 640px;
    margin: 32px auto 64px;
    padding: 0 20px;
  }
  form {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
  }
  .field {
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(0,51,102,0.12);
  }
  textarea {
    min-height: 110px;
    resize: vertical;
  }
  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  button {
    width: 100%;
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 13px 16px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #024b8a; }
  button:disabled { background: #8fa3b8; cursor: not-allowed; }
  #status {
    margin-top: 16px;
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 6px;
    display: none;
  }
  #status.success { display: block; background: #e7f4ea; color: var(--success); border: 1px solid #b9dcc2; }
  #status.error { display: block; background: #fbe9e7; color: var(--error); border: 1px solid #f0c4bf; }
  .required { color: var(--error); }
  @media (max-width: 480px) {
    .row-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>SEO Team Request Form</h1>
  <p>Submit an ad hoc request to the SEO team. You'll get a confirmation and the team will follow up over email.</p>
</header>

<main>
  <form id="ticketForm">
    <div class="field">
      <label for="name">Your name <span class="required">*</span></label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>

    <div class="row-2">
      <div class="field">
        <label for="email">Your email <span class="required">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="team">Team / department <span class="required">*</span></label>
        <input type="text" id="team" name="team" required placeholder="e.g. Brand Marketing">
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="requestType">Request type <span class="required">*</span></label>
        <select id="requestType" name="requestType" required>
          <option value="" disabled selected>Select one</option>
          <option>Metadata / title tag update</option>
          <option>New page or content SEO review</option>
          <option>Redirect request</option>
          <option>Keyword / competitive research</option>
          <option>Technical SEO issue</option>
          <option>Site audit or performance check</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="priority">Priority <span class="required">*</span></label>
        <select id="priority" name="priority" required>
          <option value="" disabled selected>Select one</option>
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
          <option>Urgent</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="url">Related URL / page (if applicable)</label>
      <input type="text" id="url" name="url" placeholder="https://www.ncl.com/...">
    </div>

    <div class="field">
      <label for="dueDate">Needed by</label>
      <input type="date" id="dueDate" name="dueDate">
    </div>

    <div class="field">
      <label for="description">Description <span class="required">*</span></label>
      <textarea id="description" name="description" required placeholder="What do you need from the SEO team? Include any relevant context, links, or deadlines."></textarea>
      <div class="hint">Be as specific as possible — this goes straight to the SEO team's inbox.</div>
    </div>

    <button type="submit" id="submitBtn">Submit request</button>
    <div id="status"></div>
  </form>
</main>

<script>
  const form = document.getElementById('ticketForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.style.display = 'none';
    statusEl.className = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    const payload = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      team: form.team.value.trim(),
      requestType: form.requestType.value,
      priority: form.priority.value,
      url: form.url.value.trim(),
      dueDate: form.dueDate.value,
      description: form.description.value.trim()
    };

    try {
      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (!res.ok || !data.ok) {
        throw new Error(data.error || 'Something went wrong submitting your request.');
      }

      statusEl.textContent = "Request submitted. The SEO team has been notified and will follow up by email.";
      statusEl.className = 'success';
      statusEl.style.display = 'block';
      form.reset();
    } catch (err) {
      statusEl.textContent = err.message || 'Something went wrong. Please try again or email the SEO team directly.';
      statusEl.className = 'error';
      statusEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit request';
    }
  });
</script>

</body>
</html>
